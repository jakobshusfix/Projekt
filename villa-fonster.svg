    <path d="M628,392 L632,410 L650,414 L632,418 L628,436 L624,418 L606,414 L624,410 Z" opacity="0.85"/>
    <path d="M214,452 L217,465 L230,468 L217,471 L214,484 L211,471 L198,468 L211,465 Z" opacity="0.75"/>
    <path d="M672,196 L675,209 L688,212 L675,215 L672,228 L669,215 L656,212 L669,209 Z" opacity="0.7"/>
  </g>

  <!-- fönsterbleck -->
  <rect x="66" y="578" width="768" height="22" rx="6" fill="url(#sill3)"/>
  <rect x="66" y="600" width="768" height="10" rx="4" fill="#d9cdba"/>

  <!-- kruka -->
  <rect x="700" y="540" width="86" height="40" rx="8" fill="#b4624a"/>
