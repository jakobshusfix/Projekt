  <rect x="104" y="122" width="692" height="438" rx="6" fill="#f4efe6"/>

  <!-- glas -->
  <rect x="118" y="136" width="664" height="410" rx="4" fill="url(#glass3)"/>

  <!-- reflektioner -->
  <polygon points="140,136 320,136 180,546 118,546 118,470" fill="#ffffff" opacity="0.20"/>
  <polygon points="470,136 560,136 420,546 340,546" fill="#ffffff" opacity="0.13"/>
  <ellipse cx="700" cy="520" rx="150" ry="120" fill="#6f9a63" opacity="0.30"/>
  <ellipse cx="240" cy="540" rx="170" ry="110" fill="#7dab6f" opacity="0.22"/>

  <!-- spröjs -->
  <rect x="470" y="136" width="14" height="410" fill="#ffffff"/>
  <rect x="118" y="330" width="664" height="14" fill="#ffffff"/>

