<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Nypolerat fönster på en villavägg med utsikt mot grönska">
  <defs>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ebde"/>
      <stop offset="1" stop-color="#e2d6c2"/>
    </linearGradient>
    <linearGradient id="glass3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d3ebf7"/>
      <stop offset="0.45" stop-color="#a8cddf"/>
      <stop offset="0.75" stop-color="#8fb9c9"/>
      <stop offset="1" stop-color="#7fae86"/>
    </linearGradient>
    <linearGradient id="sill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ddd0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="680" fill="url(#wall3)"/>
  <g stroke="#d8c9b2" stroke-width="3" opacity="0.55">
    <line x1="0" y1="54" x2="900" y2="54"/>
    <line x1="0" y1="108" x2="900" y2="108"/>
    <line x1="0" y1="612" x2="900" y2="612"/>
    <line x1="0" y1="648" x2="900" y2="648"/>
